name: Publish FreePT TEST 2.8.0 verified APK release
on:
  push:
    branches: [fix/bridge-no-extra-permissions-storage-20261123]
    paths:
      - .github/workflows/publish-freept-test-2-8-0-release.yml
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
      - name: Download verified APK from successful immutable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45472890436 -R "${GITHUB_REPOSITORY}" \
            --name FreePT-bridge-staging-stable-apk --dir /tmp/freept-apk
          find /tmp/freept-apk -maxdepth 2 -type f
          test -f /tmp/freept-apk/bridge-stable.apk
          echo 'ded66a1b50ebf957f3a6aca1bddf706578637f6fb861d26742c9d207479ac5c0  /tmp/freept-apk/bridge-stable.apk' | sha256sum --check
          cp /tmp/freept-apk/bridge-stable.apk /tmp/freept-apk/FreePT-TEST-2.8.0.apk
      - name: Publish isolated TEST APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=freept-test-2.8.0
          if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" /tmp/freept-apk/FreePT-TEST-2.8.0.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "FreePT TEST 2.8.0 - Bridge recovery" \
            --notes "TEST APK. Staging backend only. SHA-256 ded66a1b50ebf957f3a6aca1bddf706578637f6fb861d26742c9d207479ac5c0. Android version code 19. Installs over the existing TEST app when matching signing identity." \
            --prerelease
