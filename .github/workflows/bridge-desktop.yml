name: FreePT desktop Bridge TEST

on:
  push:
    branches:
      - feature/bridge-desktop-windows-macos-20261122
    paths:
      - 'desktop/**'
      - 'src/bridgeTxFolderClient.js'
      - 'src/main.js'
      - 'bridge/txFolderClient.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/bridge-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/bridgeTxFolderClient.js'
      - 'src/main.js'
      - 'bridge/txFolderClient.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/bridge-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Desktop file and worker tests
        run: npm run test:desktop
      - name: Bridge tests
        run: npm run test:bridge
      - name: Web bundle
        run: npm run build
      - name: Desktop syntax checks
        run: |
          for file in desktop/*.mjs; do node --check "$file"; done
          node --check desktop/preload.cjs
          node --check src/main.js

  package:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: macos-latest
            target: mac
            arch: x64
          - os: macos-latest
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate isolated TEST configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.FREEPT_BRIDGE_TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FREEPT_BRIDGE_TEST_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BRIDGE_TEST_API_URL: https://freept-bridge-staging.onrender.com
        run: node desktop/checkBuildConfig.mjs
      - name: Build FreePT TEST web bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.FREEPT_BRIDGE_TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FREEPT_BRIDGE_TEST_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BRIDGE_TEST_API_URL: https://freept-bridge-staging.onrender.com
          VITE_BRIDGE_ISOLATED_BUILD: 'true'
        run: npm run build
      - name: Install the pinned desktop packager
        run: npm install --no-save --package-lock=false electron-builder@26.18.0
      - name: Package Windows TEST app
        if: matrix.target == 'win'
        run: npx electron-builder --config desktop/electron-builder.yml --win nsis --x64 --publish never
      - name: Verify and hash Windows TEST installer
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $installer = Get-Item "release\FreePT-Bridge-TEST-win-x64.exe"
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw "Unexpected Windows signature status" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer.FullName).Hash.ToLowerInvariant()
          $record = @(
            "file=$($installer.Name)"
            "size_bytes=$($installer.Length)"
            "sha256=$hash"
            "signature=$($signature.Status)"
          )
          Set-Content -Path "release\verification.txt" -Value $record -Encoding utf8
          $record | ForEach-Object { Write-Output $_ }
      - name: Package macOS TEST app
        if: matrix.target == 'mac'
        run: npx electron-builder --config desktop/electron-builder.yml --mac dmg --${{ matrix.arch }} --publish never
      - name: Verify and hash macOS TEST disk image
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          image="release/FreePT-Bridge-TEST-mac-${{ matrix.arch }}.dmg"
          hdiutil verify "$image"
          mountpoint="$(mktemp -d)"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mountpoint" >/dev/null
          trap 'hdiutil detach "$mountpoint" -quiet >/dev/null; rmdir "$mountpoint"' EXIT
          app="$mountpoint/FreePT.app"
          test -d "$app"
          details="$mountpoint/signature-details.txt"
          if codesign -dv --verbose=2 "$app" >"$details" 2>&1; then
            if grep -q '^TeamIdentifier=not set$' "$details" || ! grep -q '^Authority=' "$details"; then
              signature_status="unsigned-or-ad-hoc"
            else
              signature_status="signed"
            fi
          else
            signature_status="unsigned"
          fi
          hash="$(shasum -a 256 "$image" | awk '{print $1}')"
          size="$(stat -f '%z' "$image")"
          {
            echo "file=$(basename "$image")"
            echo "size_bytes=$size"
            echo "sha256=$hash"
            echo "signature=$signature_status"
          } | tee release/verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FreePT-Bridge-TEST-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/FreePT-Bridge-TEST-${{ matrix.target }}-${{ matrix.arch }}.*
            release/verification.txt
          compression-level: 0
          if-no-files-found: error
