name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/build-tools"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax check
        run: node --check src/main.js
      - name: Build web bundle (3-minute diagnostic timeout)
        shell: bash
        run: |
          set -euo pipefail
          echo "Node: $(node --version) / npm: $(npm --version)"
          echo "Vite path: $(readlink -f node_modules/.bin/vite)"
          timeout --signal=TERM --kill-after=10s 180s npm run build 2>&1 | tee vite-build.log
          test -s dist/index.html
      - name: Upload Vite build diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-vite-build-diagnostic
          path: vite-build.log
          if-no-files-found: warn
      - name: Generate and synchronize Android project
        env:
          FREEPT_GOOGLE_SERVICES_JSON: ${{ secrets.FREEPT_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          npx cap add android
          # This feature must NOT produce an APK without Firebase credentials.
          # Store the actual google-services.json CONTENT as an Actions secret.
          # Never commit Firebase configuration files to GitHub.
          test -n "${FREEPT_GOOGLE_SERVICES_JSON:-}" || {
            echo 'Missing FREEPT_GOOGLE_SERVICES_JSON GitHub Actions secret'; exit 1;
          }
          printf '%s' "$FREEPT_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 - <<'PY'
          import json
          cfg=json.load(open('android/app/google-services.json'))
          clients=cfg.get('client',[])
          assert any(a.get('client_info',{}).get('android_client_info',{}).get('package_name')=='it.freept.app' for a in clients), 'Firebase JSON must match it.freept.app'
          print('Firebase Android package verified')
          PY
          npx cap sync android
          test -s android/capacitor.settings.gradle
      - name: Ensure Android biometric permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.USE_BIOMETRIC' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application', 1)
              p.write_text(s)
          assert 'android.permission.USE_BIOMETRIC' in p.read_text()
          PY
      - name: Check Android project and permissions
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || {
            echo 'Missing INTERNET permission'; exit 1;
          }
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Verify APK integrity and identity
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee android-apk-info.txt
          grep -q "package: name='it.freept.app'" android-apk-info.txt
          sha256sum "$APK" | tee android-apk-sha256.txt
      - name: Upload APK verification report
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-apk-report
          path: |
            android-apk-info.txt
            android-apk-sha256.txt
          if-no-files-found: error
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
