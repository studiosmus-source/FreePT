name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax check
        run: node --check src/main.js
      - name: Build web bundle
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Check Android project and permissions
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || {
            echo 'Missing INTERNET permission'; exit 1;
          }
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
