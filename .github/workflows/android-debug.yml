name: Build Android APK
on:
  push:
    branches: [main, 'feature/bridge-chunk-receiver-20261108']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/build-tools"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: JavaScript syntax check
        run: node --check src/main.js
      - name: Verify unified Bridge runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          if test -f src/bridgeRuntimeConfig.test.mjs; then
            node --test src/bridgeRuntimeConfig.test.mjs
          fi
      - name: Bridge regression tests when Bridge sources are present
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'bridge/*.test.mjs' > /dev/null; then
            npm run test:bridge
          else
            echo 'No Bridge tests on this branch; skipping.'
          fi
      - name: Configure production Bridge for Android
        env:
          BRIDGE_API_URL: ${{ vars.FREEPT_BRIDGE_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BRIDGE_API_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]]; then
            echo "::error::Set repository variable FREEPT_BRIDGE_API_URL to the deployed HTTPS Bridge backend before building Android."
            exit 1
          fi
          echo "VITE_BRIDGE_PRODUCTION_BUILD=true" >> "$GITHUB_ENV"
          echo "VITE_BRIDGE_API_URL=${BRIDGE_API_URL%/}" >> "$GITHUB_ENV"
          echo "Production Bridge enabled for Android bundle."
      - name: Build web bundle (3-minute diagnostic timeout)
        shell: bash
        run: |
          set -euo pipefail
          echo "Node: $(node --version) / npm: $(npm --version)"
          echo "Vite path: $(readlink -f node_modules/.bin/vite)"
          timeout --signal=TERM --kill-after=10s 180s npm run build 2>&1 | tee vite-build.log
          test -s dist/index.html
      - name: Upload Vite build diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-vite-build-diagnostic
          path: vite-build.log
          if-no-files-found: warn
      - name: Generate and synchronize Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          npx cap add android
          npx cap sync android
          test -s android/capacitor.settings.gradle
      - name: Ensure Android biometric permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.USE_BIOMETRIC' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application', 1)
              p.write_text(s)
          assert 'android.permission.USE_BIOMETRIC' in p.read_text()
          PY
      - name: Check Android project and permissions
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || {
            echo 'Missing INTERNET permission'; exit 1;
          }
      - name: Prepare Gradle wrapper download with retries
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          WRAPPER=gradle/wrapper/gradle-wrapper.properties
          test -f "$WRAPPER"
          # Generated by Capacitor. Bound download timeout on a clean CI runner.
          if grep -q '^networkTimeout=' "$WRAPPER"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER"
          else
            printf '\nnetworkTimeout=120000\n' >> "$WRAPPER"
          fi
          for attempt in 1 2 3; do
            echo "Gradle wrapper download attempt $attempt/3"
            if ./gradlew --version --no-daemon; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Gradle distribution download failed after 3 attempts'
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Verify APK integrity and identity
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee android-apk-info.txt
          EXPECTED_ID=it.freept.app
          grep -Fq "package: name='$EXPECTED_ID'" android-apk-info.txt
          echo "Verified application ID: $EXPECTED_ID"
          sha256sum "$APK" | tee android-apk-sha256.txt
      - name: Upload APK verification report
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-apk-report
          path: |
            android-apk-info.txt
            android-apk-sha256.txt
          if-no-files-found: error
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
