name: Bridge isolated checks

on:
  push:
    branches:
      - feature/bridge-admin-foundation-20261106
    paths:
      - 'bridge/**'
      - 'supabase/migrations/20261106_bridge_*.sql'
      - 'supabase/bridge_preflight.sql'
      - 'package.json'
      - '.github/workflows/bridge-checks.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - 'supabase/migrations/20261106_bridge_*.sql'
      - 'supabase/bridge_preflight.sql'
      - 'package.json'
      - '.github/workflows/bridge-checks.yml'

permissions:
  contents: read

jobs:
  bridge-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bridge model tests
        run: npm run test:bridge
      - name: Syntax check every Bridge module and FreePT entrypoint
        run: |
          for file in bridge/*.mjs src/main.js; do
            node --check "$file"
          done
