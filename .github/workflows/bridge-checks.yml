name: Bridge isolated checks

on:
  push:
    branches:
      - feature/bridge-admin-foundation-20261106
    paths:
      - 'bridge/**'
      - 'supabase/migrations/20261106_bridge_*.sql'
      - 'supabase/bridge_preflight.sql'
      - 'package.json'
      - 'src/**'
      - 'index.html'
      - '.github/workflows/bridge-checks.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - 'supabase/migrations/20261106_bridge_*.sql'
      - 'supabase/bridge_preflight.sql'
      - 'package.json'
      - 'src/**'
      - 'index.html'
      - '.github/workflows/bridge-checks.yml'

permissions:
  contents: read

jobs:
  bridge-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bridge model tests
        run: npm run test:bridge
      - name: Syntax check every Bridge module and FreePT entrypoint
        run: |
          for file in bridge/*.mjs src/main.js; do
            node --check "$file"
          done

  freept-web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FreePT dependencies
        run: npm install --no-audit --no-fund
      - name: Build FreePT web bundle
        run: npm run build
      - name: Verify generated entrypoint
        run: test -s dist/index.html

  bridge-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bridge_ci
          POSTGRES_PASSWORD: bridge_ci_only
          POSTGRES_DB: bridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge_ci -d bridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: bridge_ci
      PGPASSWORD: bridge_ci_only
      PGDATABASE: bridge_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Bootstrap disposable identities and apply Bridge migrations
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f bridge/postgres-ci-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_bridge_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_bridge_owner_controls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_bridge_device_verifiers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_bridge_audit.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_bridge_jobs_staging.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_bridge_job_admin_staging.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_bridge_job_revocation_fence.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_bridge_tx_sessions_staging.sql
      - name: Assert PostgreSQL permissions and real Bridge job transitions
        run: psql -v ON_ERROR_STOP=1 -f bridge/postgres-ci-tests.sql
      - name: Assert PostgreSQL admin job status and cancellation
        run: psql -v ON_ERROR_STOP=1 -f bridge/postgres-ci-admin-jobs.sql
      - name: Assert revoked and owner-disabled jobs never revive
        run: psql -v ON_ERROR_STOP=1 -f bridge/postgres-ci-revocation-fence.sql
      - name: Assert persistent TX session supersession expiry and revocation
        run: psql -v ON_ERROR_STOP=1 -f bridge/postgres-ci-tx-sessions.sql
      - name: Assert transaction blocks concurrent claim during owner shutdown
        run: bash bridge/postgres-ci-concurrency.sh
      - name: Run Node adapter against real disposable PostgreSQL RPCs
        run: node --test bridge/postgresJobsLive.integration.mjs
      - name: Enforce shared TX session inside PostgreSQL claim and completion
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_bridge_job_session_fence.sql
      - name: Assert atomic TX session fencing for real database jobs
        run: psql -v ON_ERROR_STOP=1 -f bridge/postgres-ci-atomic-session-jobs.sql
      - name: Verify Node shared sessions and persistent jobs together
        run: node --test bridge/postgresSessionsLive.integration.mjs
