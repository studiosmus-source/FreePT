name: Build unified FreePT Android APK (manual)
on:
  push:
    branches: [feature/bridge-chunk-receiver-20261108]
    paths:
      - '.github/workflows/freept-unified-apk.yml'
      - 'android-bridge/install_firebase.py'
      - 'android-bridge/test_install_firebase.py'
      - 'src/main.js'
      - 'src/adminOtpAuth.js'
      - 'src/style.css'
      - 'bridge/adminOtpAuth.test.mjs'
      - 'bridge/adminLoginUi.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Refuse other branches
        run: test "$GITHUB_REF" = 'refs/heads/feature/bridge-chunk-receiver-20261108'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate explicit production Bridge configuration
        env:
          VITE_BRIDGE_API_URL: ${{ vars.FREEPT_BRIDGE_API_URL }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          raw=os.environ.get('VITE_BRIDGE_API_URL','')
          parsed=urlparse(raw)
          if not raw or parsed.scheme!='https' or not parsed.hostname or parsed.port or parsed.username or parsed.password or parsed.path not in ('','/') or parsed.query or parsed.fragment:
              raise SystemExit('Configure FREEPT_BRIDGE_PRODUCTION_API_URL with a verified HTTPS Bridge server before building')
          if parsed.hostname=='cpopqsvzzxfjgnlawlvc.supabase.co':
              raise SystemExit('Supabase host cannot be the Bridge gateway')
          PY
      - name: Install dependencies and run regression tests
        run: |
          npm install --no-audit --no-fund
          npm run test:bridge
          node --test src/bridgeRuntimeConfig.test.mjs src/pushRegistration.test.mjs
          node --check src/main.js
          node --check src/pushRegistration.js
          python3 -m py_compile android-bridge/install.py android-bridge/install_firebase.py
          python3 -m unittest discover -s android-bridge -p 'test_*.py'
      - name: OTA foundation safety checks
        run: node --test ota/*.test.mjs src/otaReady.test.mjs
      - name: Build production web bundle with native Bridge enabled
        env:
          VITE_BRIDGE_PRODUCTION_BUILD: 'true'
          VITE_BRIDGE_API_URL: ${{ vars.FREEPT_BRIDGE_API_URL }}
        run: |
          npm run build
          test -s dist/index.html
      - name: Configure native OTA only after explicit deployment opt-in
        env:
          FREEPT_OTA_ENABLED: ${{ vars.FREEPT_OTA_ENABLED }}
          FREEPT_OTA_UPDATE_URL: ${{ vars.FREEPT_OTA_UPDATE_URL }}
        run: node ota/configureNative.mjs
      - name: Generate production Android project
        run: |
          node -e "const c=require('./capacitor.config.json');if(c.appId!=='it.freept.app')process.exit(1)"
          npx cap add android
          npx cap sync android
      - name: Install native Bridge in the same production app
        env:
          FREEPT_BRIDGE_INSTALL_TARGET: production
          FREEPT_BRIDGE_PRODUCTION_OPT_IN: I_ACCEPT_PRODUCTION_BRIDGE
          VITE_BRIDGE_API_URL: ${{ vars.FREEPT_BRIDGE_API_URL }}
        run: python3 android-bridge/install.py
      - name: Install native Firebase push configuration
        env:
          FREEPT_FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FREEPT_BRIDGE_GOOGLE_SERVICES_B64 }}
        run: python3 android-bridge/install_firebase.py
      - name: Ensure biometric permission
        run: python3 android-bridge/ensure_biometric.py
      - name: Stabilize Gradle wrapper download
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          test -f "$WRAPPER"
          grep -Eq '^distributionUrl=.*gradle-8\.11\.1-' "$WRAPPER" || {
            echo 'Unexpected Gradle wrapper version; refusing silent override'; exit 1;
          }
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip#' "$WRAPPER"
          if grep -q '^networkTimeout=' "$WRAPPER"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER"
          else
            printf '\nnetworkTimeout=120000\n' >> "$WRAPPER"
          fi
          grep -Fq 'downloads.gradle.org/distributions/gradle-8.11.1-bin.zip' "$WRAPPER"
      - name: Verify native Bridge and Firebase integration before compiling
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          grep -Fq "com.google.gms.google-services" android/app/build.gradle
          grep -Fq "com.google.gms:google-services" android/build.gradle
          grep -Fq "BridgeTxService" android/app/src/main/AndroidManifest.xml
          grep -Fq "android.permission.POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml
          grep -Fq "android.permission.USE_BIOMETRIC" android/app/src/main/AndroidManifest.xml
          grep -Fq "BridgeFilesPlugin.class" "$(find android/app/src/main/java -name MainActivity.java -print -quit)"
          grep -Fq "BridgeTxControlPlugin.class" "$(find android/app/src/main/java -name MainActivity.java -print -quit)"
          test -f android/capacitor-cordova-android-plugins/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          files=list(Path('android/app/src/main/java').rglob('BridgeTxService.java'))
          assert len(files)==1, 'Native Bridge TX service missing'
          PY
      - name: Compile unified Android APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Sign unified APK using retained FreePT signing identity
        shell: bash
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.FREEPT_BRIDGE_KEYSTORE_B64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.FREEPT_BRIDGE_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.FREEPT_BRIDGE_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.FREEPT_BRIDGE_KEY_PASSWORD }}
          SIGN_CERT_SHA256: ${{ secrets.FREEPT_BRIDGE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_B64 SIGN_STORE_PASSWORD SIGN_KEY_ALIAS SIGN_KEY_PASSWORD SIGN_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Retained APK signing configuration missing; no unstable APK published"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$SIGN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/freept-unified.jks"
          keytool -list -keystore "$RUNNER_TEMP/freept-unified.jks" -storepass:env SIGN_STORE_PASSWORD -alias "$SIGN_KEY_ALIAS" >/dev/null
          TOOL="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$TOOL"
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          APK=android/app/build/outputs/apk/debug/FreePT-unified-stable.apk
          "$TOOL" sign --ks "$RUNNER_TEMP/freept-unified.jks" --ks-pass env:SIGN_STORE_PASSWORD --ks-key-alias "$SIGN_KEY_ALIAS" --key-pass env:SIGN_KEY_PASSWORD --out "$APK" "$SRC"
          "$TOOL" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/unified-signer-audit.txt"
          KEY_SHA="$(keytool -exportcert -keystore "$RUNNER_TEMP/freept-unified.jks" -storepass:env SIGN_STORE_PASSWORD -alias "$SIGN_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          EXPECTED="$(printf '%s' "$SIGN_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] && [[ "$KEY_SHA" == "$EXPECTED" ]] || {
            echo '::error::Retained signing certificate mismatch; APK withheld'
            exit 1
          }
          grep -Fqi "$KEY_SHA" "$RUNNER_TEMP/unified-signer-audit.txt" || {
            echo '::error::APK signer differs from retained keystore; APK withheld'
            exit 1
          }
          echo 'Stable APK signature verified'
      - name: Verify APK identity and integrity
        run: |
          APK=android/app/build/outputs/apk/debug/FreePT-unified-stable.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee apk-info.txt
          grep -Fq "package: name='it.freept.app'" apk-info.txt
          sha256sum "$APK" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FreePT-unified-stable-apk
          path: |
            android/app/build/outputs/apk/debug/FreePT-unified-stable.apk
            apk-info.txt
            apk-sha256.txt
          if-no-files-found: error
