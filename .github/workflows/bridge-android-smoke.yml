name: Bridge Android isolated compile check
on:
  push:
    branches:
      - feature/bridge-chunk-receiver-20261108
      - work/unified-verified-20261119
    paths:
      - 'android-bridge/**'
      - 'src/**'
      - 'bridge/**'
      - 'capacitor.config.json'
      - '.github/workflows/bridge-android-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-isolated-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build isolated, nonfunctional test web bundle
        env:
          VITE_SUPABASE_URL: https://bridge-build-only.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aaaaaaaaaaaaaaaaaaaaaaaa
          VITE_BRIDGE_ISOLATED_BUILD: 'true'
          VITE_BRIDGE_TEST_API_URL: https://bridge-bootstrap-ci.invalid
          VITE_BRIDGE_BOOTSTRAP_ENABLED: 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
      - name: Generate isolated Android project and register SAF plugins
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('capacitor.config.json')
          data=json.loads(p.read_text())
          if data.get('appId')!='it.freept.app':
              raise SystemExit('Unexpected app identity, refusing')
          data['appId']='it.freept.bridge.next'
          data['appName']='FreePT Bridge 2 CI'
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          npx cap add android
          npx cap sync android
          FREEPT_BRIDGE_BOOTSTRAP=STAGING_DEVICE_KEY_V1 VITE_BRIDGE_TEST_API_URL=https://bridge-bootstrap-ci.invalid python3 android-bridge/install.py
          grep -Fq 'BridgeDestinationPlugin.class' android/app/src/main/java/it/freept/bridge/next/MainActivity.java
      - name: Install native SAF simulation tests (isolated only)
        run: python3 android-bridge/install_destination_tests.py
      - name: Prefer direct Gradle distribution mirror on generated Android project
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          test -f "$WRAPPER"
          # Avoid the GitHub release redirect currently returning 504.
          # Keep the same Gradle version; use the smaller binary distribution.
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip#' "$WRAPPER"
          if grep -q '^networkTimeout=' "$WRAPPER"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$WRAPPER"
          else
            printf '\\nnetworkTimeout=120000\\n' >> "$WRAPPER"
          fi
          grep -Fq 'downloads.gradle.org/distributions/gradle-8.11.1-bin.zip' "$WRAPPER"
      - name: Verify Android Gradle project compiles
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Require execution of every native SAF simulation test
        run: |
          python3 - <<'PY_VERIFY_NATIVE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('android/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          selected=[s for s in suites if s.get('name','').endswith('BridgeDestinationTest')]
          assert len(selected)==1, 'Actual native SAF test report missing'
          s=selected[0]
          assert int(s.get('tests','0'))>=9 and all(int(s.get(k,'0'))==0 for k in ('failures','errors','skipped')), s.attrib
          print('NATIVE_SAF_SIMULATION:',s.attrib)
          PY_VERIFY_NATIVE
      - name: Verify this is not the production app
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='it.freept.bridge.next'"
          unzip -t "$APK" > /dev/null
          sha256sum "$APK"
      # Compile-only: never publish an unconfigured or ephemeral-signed APK.
      - name: Preserve native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-native-SAF-tests
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
