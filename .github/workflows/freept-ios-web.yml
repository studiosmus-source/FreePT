name: FreePT iPhone Safari Web TEST
on:
  push:
    branches: [feature/freept-ios-user-20261123]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update package lock for iOS target
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Test client, server contracts and Bridge regressions
        run: |
          node --test src/iosUser.test.mjs src/pushRegistration.test.mjs src/importantAlerts.test.mjs src/chatAttachments.test.mjs
          node --check src/main.js
          npm run test:bridge
          python3 -m unittest ios-support/test_patch_appdelegate.py
      - name: Enforce staging Supabase, never production
        env:
          VITE_SUPABASE_URL: ${{ vars.FREEPT_BRIDGE_TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FREEPT_BRIDGE_TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          u=urlparse(os.environ.get('VITE_SUPABASE_URL',''))
          assert u.scheme=='https' and u.hostname and u.hostname.endswith('.supabase.co')
          assert u.hostname!='cpopqsvzzxfjgnlawlvc.supabase.co'
          assert os.environ.get('VITE_SUPABASE_PUBLISHABLE_KEY','').startswith('sb_publishable_')
          print('Isolated iPhone TEST client enforced')
          PY
      - name: Compile iPhone Safari client
        env:
          VITE_BRIDGE_ISOLATED_BUILD: 'true'
          VITE_BRIDGE_TEST_API_URL: https://freept-bridge-staging.onrender.com
          VITE_SUPABASE_URL: ${{ vars.FREEPT_BRIDGE_TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.FREEPT_BRIDGE_TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/manifest.webmanifest
      - name: Upload iOS web build
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-iPhone-Safari-WEB
          path: dist/
      - name: Upload resolved iOS dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: FreePT-iOS-package-lock-web
          path: package-lock.json

      - name: Publish reviewed staging-only assets to dedicated GitHub preview branch
        if: github.ref == 'refs/heads/feature/freept-ios-user-20261123'
        run: |
          set -euo pipefail
          cp -R dist "$RUNNER_TEMP/freept-ios-dist"
          target="$RUNNER_TEMP/freept-ios-preview-worktree"
          if git ls-remote --exit-code origin refs/heads/ios-preview-assets > /dev/null; then
            git fetch origin refs/heads/ios-preview-assets
            git worktree add -B ios-preview-assets "$target" FETCH_HEAD
          else
            git worktree add --detach "$target"
            git -C "$target" checkout --orphan ios-preview-assets
            git -C "$target" rm -rf . > /dev/null
          fi
          mkdir -p "$target"
          cp -R "$RUNNER_TEMP/freept-ios-dist/." "$target/"
          git -C "$target" config user.name 'FreePT iPhone CI'
          git -C "$target" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$target" add -A
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" commit -m 'build(ios): update staged Safari preview assets [skip ci]'
          fi
          git -C "$target" push origin HEAD:refs/heads/ios-preview-assets
